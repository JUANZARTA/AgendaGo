<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Agenda Co</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7c3aed">
  <meta name="description" content="Agenda Co — Reservá tu turno online en salones, barberías y spas de Colombia">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="icons/icon-152x152.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root>
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8f7ff">
      <div style="text-align:center">
        <div style="width:48px;height:48px;border:3px solid #ede9fe;border-top-color:#7c3aed;border-radius:50%;animation:ag-spin .7s linear infinite;margin:0 auto"></div>
        <p style="color:#888;font-size:14px;margin-top:16px;font-family:sans-serif;font-weight:600">Cargando...</p>
      </div>
    </div>
    <style>@keyframes ag-spin{to{transform:rotate(360deg)}}</style>
  </app-root>
  <noscript>Por favor habilitá JavaScript para continuar.</noscript>
</body>
</html>
