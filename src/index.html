<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AgendaCo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AgendaCo">
  <meta name="description" content="AgendaCo — Reserva tu turno online en salones, consultorios, estudios y más negocios de Colombia">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root>
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8f7ff">
      <div style="text-align:center">
        <img src="images/logo.svg" alt="AgendaCo" width="72" height="72" style="display:block;margin:0 auto;animation:ag-pulse 1.2s ease-in-out infinite">
        <p style="color:#888;font-size:14px;margin-top:16px;font-family:sans-serif;font-weight:600">Cargando...</p>
      </div>
    </div>
    <style>@keyframes ag-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.94)}}</style>
  </app-root>
  <noscript>Por favor habilita JavaScript para continuar.</noscript>
</body>
</html>
