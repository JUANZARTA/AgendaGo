<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
  <div style="width:100%;max-width:420px">

    <!-- Logo -->
    <div style="text-align:center;margin-bottom:32px">
      <div style="width:64px;height:64px;border-radius:20px;background:var(--gradient);display:inline-flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 8px 24px rgba(124,58,237,.35);margin-bottom:16px">
        ✂️
      </div>
      <h1 style="font-size:1.8rem;font-weight:800;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent">
        Agenda Co
      </h1>
      <p style="color:#888;margin-top:6px;font-size:14px">Bienvenido de vuelta 👋</p>
    </div>

    <div class="card">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Email</label>
          <input id="email" type="email" formControlName="email" placeholder="tu@email.com" />
          @if (form.get('email')?.touched && form.get('email')?.hasError('email')) {
            <span style="color:var(--pink);font-size:12px;font-weight:600">Email inválido</span>
          }
        </div>

        <div class="form-group" style="margin-bottom:8px">
          <label>Contraseña</label>
          <input id="password" type="password" formControlName="password" placeholder="••••••••" />
        </div>

        <div style="text-align:right;margin-bottom:18px">
          <a routerLink="/auth/forgot-password" style="color:var(--purple);font-size:13px;font-weight:600">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        @if (error()) {
          <div style="background:#ffe4e8;border:1.5px solid #fda4af;border-radius:10px;padding:10px 14px;color:#be123c;font-size:13px;font-weight:600;margin-bottom:14px">
            ⚠ {{ error() }}
          </div>
        }

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%" [disabled]="loading()">
          {{ loading() ? 'Ingresando...' : 'Iniciar sesión' }}
        </button>
      </form>

      <div style="display:flex;align-items:center;gap:12px;margin:20px 0">
        <hr class="divider" style="flex:1;margin:0" />
        <span style="color:#b0a8c8;font-size:13px;font-weight:600">o</span>
        <hr class="divider" style="flex:1;margin:0" />
      </div>

      <button class="btn" style="width:100%;background:white;border:2px solid #ede9fe;color:#333;box-shadow:0 2px 8px rgba(0,0,0,.06)"
        (click)="onGoogle()" [disabled]="loading()">
        <svg width="18" height="18" viewBox="0 0 24 24" style="flex-shrink:0">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continuar con Google
      </button>

      <p style="text-align:center;margin-top:20px;font-size:14px;color:#888">
        ¿No tenés cuenta?
        <a routerLink="/auth/register" style="color:var(--purple);font-weight:700;margin-left:4px">Registrate gratis</a>
      </p>
    </div>
  </div>
</div>
