<router-outlet />

@if (showBanner()) {
  <div style="position:fixed;bottom:0;left:0;right:0;z-index:9999;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:white;box-shadow:0 -4px 24px rgba(0,0,0,.12);border-top:2px solid #ede9fe;display:flex;align-items:center;gap:12px;animation:slideUp .3s ease">

    <div style="width:40px;height:40px;border-radius:12px;background:var(--gradient);display:flex;align-items:center;justify-content:center;flex-shrink:0">
      <svg width="26" height="26" viewBox="0 0 100 100" fill="none">
        <circle cx="30" cy="73" r="12" stroke="white" stroke-width="8.5"/>
        <polyline points="30,61 50,51 80,18" stroke="white" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="70" cy="73" r="12" stroke="white" stroke-width="8.5"/>
        <polyline points="70,61 50,51 20,18" stroke="white" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div style="flex:1;min-width:0">
      <div style="font-size:13px;font-weight:800;color:#1a1a2e">Instalar Agenda Co</div>
      @if (isIos()) {
        <div style="font-size:11px;color:#888;margin-top:1px">Tocá
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin:0 1px"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          y luego <strong>Agregar a inicio</strong>
        </div>
      } @else {
        <div style="font-size:11px;color:#888;margin-top:1px">Acceso rápido desde tu pantalla de inicio</div>
      }
    </div>

    @if (!isIos()) {
      <button (click)="install()"
        style="background:var(--gradient);color:white;border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0">
        Instalar
      </button>
    }

    <button (click)="dismiss()"
      style="width:28px;height:28px;border-radius:8px;border:none;background:#f5f0ff;color:#888;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;flex-shrink:0">
      ×
    </button>
  </div>
}
