<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#7c3aed"/>
  <!-- Brazo izquierdo: aro izq → pivot → punta upper-right -->
  <circle cx="30" cy="73" r="12" fill="none" stroke="white" stroke-width="8.5"/>
  <polyline points="30,61 50,51 80,18" fill="none" stroke="white" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Brazo derecho: aro der → pivot → punta upper-left -->
  <circle cx="70" cy="73" r="12" fill="none" stroke="white" stroke-width="8.5"/>
  <polyline points="70,61 50,51 20,18" fill="none" stroke="white" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
